<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biostatistics | Clinical Medicine</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 250px;
    height: 100vh;
    background: #003b5c;
    color: white;
    padding: 25px 15px;
    z-index: 1000;
}

.sidebar .logo {
    text-align: center;
    padding-bottom: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.sidebar .logo h2 {
    font-size: 20px;
    margin-bottom: 6px;
}

.sidebar .logo p {
    font-size: 12px;
    opacity: 0.8;
}

.nav {
    margin-top: 25px;
}

.nav button {
    width: 100%;
    border: none;
    background: transparent;
    color: white;
    padding: 14px 15px;
    margin-bottom: 6px;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.nav button:hover,
.nav button.active {
    background: #00577f;
}

/* MAIN */
.main {
    margin-left: 250px;
    min-height: 100vh;
}

.topbar {
    background: white;
    padding: 18px 30px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.topbar h1 {
    color: #003b5c;
    font-size: 22px;
}

.menu-btn {
    display: none;
    background: #003b5c;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
}

.content {
    padding: 30px;
    max-width: 1250px;
}

/* PAGES */
.page {
    display: none;
}

.page.active {
    display: block;
}

/* DASHBOARD */
.hero {
    background: linear-gradient(135deg, #003b5c, #00577f);
    color: white;
    padding: 35px;
    border-radius: 14px;
    margin-bottom: 25px;
}

.hero h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.hero p {
    line-height: 1.6;
    opacity: 0.95;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stat-card h3 {
    color: #003b5c;
    font-size: 28px;
    margin-bottom: 6px;
}

.stat-card p {
    color: #666;
    font-size: 14px;
}

.section-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

.section-card h2 {
    color: #003b5c;
    margin-bottom: 12px;
}

.section-card p {
    line-height: 1.6;
    color: #555;
}

/* PROGRESS */
.progress-container {
    margin-top: 18px;
}

.progress-bar {
    width: 100%;
    height: 14px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #003b5c;
    transition: width 0.3s;
}

.progress-text {
    margin-top: 8px;
    font-size: 14px;
    color: #666;
}

/* MODULES */
.page-title {
    margin-bottom: 10px;
    color: #003b5c;
    font-size: 28px;
}

.page-description {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.6;
}

.modules {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.module {
    background: white;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: 0.2s;
    position: relative;
}

.module:hover {
    transform: translateY(-3px);
}

.module-number {
    color: #00577f;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 10px;
}

.module h3 {
    color: #222;
    font-size: 18px;
    line-height: 1.4;
    margin-bottom: 10px;
}

.module p {
    color: #666;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 18px;
}

.open-btn {
    display: inline-block;
    background: #003b5c;
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    border: none;
}

.open-btn:hover {
    background: #00577f;
}

/* LOCKED MODULE */
.locked {
    opacity: 0.65;
}

.locked .open-btn {
    background: #888;
    cursor: not-allowed;
}

/* SCHEDULE */
.schedule-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

.schedule-table th,
.schedule-table td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

.schedule-table th {
    background: #003b5c;
    color: white;
}

.schedule-table tr:last-child td {
    border-bottom: none;
}

/* ABOUT */
.about-list {
    margin-top: 15px;
    padding-left: 20px;
}

.about-list li {
    margin-bottom: 10px;
    color: #555;
}

/* MOBILE */
@media (max-width: 800px) {

    .sidebar {
        transform: translateX(-100%);
        transition: 0.3s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        margin-left: 0;
    }

    .menu-btn {
        display: block;
    }

    .topbar {
        padding: 15px 20px;
    }

    .topbar h1 {
        font-size: 18px;
    }

    .content {
        padding: 20px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .hero h2 {
        font-size: 23px;
    }
}

@media (max-width: 500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .modules {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

    <div class="logo">
        <h2>Biostatistics</h2>
        <p>Clinical Medicine</p>
    </div>

    <nav class="nav">

        <button class="active" onclick="showPage('dashboard', this)">
            🏠 Dashboard
        </button>

        <button onclick="showPage('course', this)">
            📚 Course Content
        </button>

        <button onclick="showPage('schedule', this)">
            📅 Course Schedule
        </button>

        <button onclick="showPage('progress', this)">
            📊 My Progress
        </button>

        <button onclick="showPage('about', this)">
            ℹ️ About Course
        </button>

    </nav>

</aside>


<!-- MAIN -->
<main class="main">

    <!-- TOP BAR -->
    <header class="topbar">

        <button class="menu-btn" onclick="toggleSidebar()">
            ☰
        </button>

        <h1>Biostatistics for Clinical Medicine</h1>

        <span>12-Week Course</span>

    </header>
